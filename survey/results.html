<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>調查結果</title>
<style>
  :root { --ink:#111827; --sub:#4b5563; --line:#d1d5db; --bg:#ffffff; --panel:#f3f4f6; --bar:#1e40af; --track:#e5e7eb; --m:#1d4ed8; --f:#be185d; --n:#4b5563; --danger:#b42318; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; font-size:clamp(18px,1.6vw,26px); line-height:1.4; }
  main { max-width:1500px; margin:0 auto; padding:clamp(12px,2vw,32px) 16px 40px; }
  h1 { font-size:clamp(28px,3vw,48px); margin:0 0 clamp(10px,1.5vw,20px); }
  button { font:inherit; cursor:pointer; }
  [hidden] { display:none !important; }

  .counts { display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(8px,1vw,16px); margin-bottom:clamp(14px,2vw,28px); }
  .count { background:var(--panel); border-radius:14px; padding:clamp(8px,1vw,16px); text-align:center; }
  .count .k { font-size:clamp(18px,1.8vw,30px); font-weight:700; color:var(--sub); }
  .count .v { font-size:clamp(40px,5vw,84px); font-weight:800; line-height:1.1; }
  .count.m .v { color:var(--m); } .count.f .v { color:var(--f); } .count.n .v { color:var(--n); }
  .count.all { background:var(--ink); color:#fff; } .count.all .k { color:#e5e7eb; }

  .tabs { display:flex; gap:clamp(6px,1vw,14px); margin-bottom:clamp(12px,1.6vw,24px); flex-wrap:wrap; }
  .tab { flex:1; min-width:150px; font-size:clamp(20px,2.2vw,36px); font-weight:800; padding:clamp(8px,1vw,16px); border:3px solid var(--ink); border-radius:14px; background:#fff; color:var(--ink); }
  .tab.on { background:var(--ink); color:#fff; }

  .chart { min-height:40vh; }
  .chart h2 { font-size:clamp(24px,2.6vw,42px); margin:0 0 clamp(8px,1vw,16px); }
  .chart h2 small { font-weight:600; color:var(--sub); font-size:.65em; }
  .row { display:grid; grid-template-columns:clamp(40px,4vw,70px) minmax(0,38%) 1fr; align-items:center; gap:clamp(8px,1vw,18px); margin-bottom:clamp(10px,1.4vw,22px); }
  .rank { font-size:clamp(28px,3vw,52px); font-weight:800; text-align:center; }
  .label { font-size:clamp(22px,2.3vw,40px); font-weight:700; line-height:1.25; }
  .track { background:var(--track); border-radius:10px; height:clamp(44px,5vw,84px); position:relative; overflow:hidden; }
  .fill { background:var(--bar); height:100%; border-radius:10px; transition:width .5s; }
  .pct { position:absolute; top:0; bottom:0; display:flex; align-items:center; font-weight:800; font-size:clamp(24px,2.6vw,46px); white-space:nowrap; }
  .pct small { font-weight:600; font-size:.6em; margin-left:.4em; }
  .pct.in { color:#fff; } .pct.out { color:var(--ink); }
  .tie { color:var(--sub); font-size:.55em; font-weight:700; margin-left:.3em; white-space:nowrap; }
  .empty { font-size:clamp(32px,4vw,64px); font-weight:800; color:var(--sub); text-align:center; padding:12vh 0; }
  .foot { color:var(--sub); font-size:clamp(14px,1.2vw,20px); margin-top:10px; }

  .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:40px; padding-top:16px; border-top:2px dashed var(--line); font-size:18px; }
  .toolbar button { padding:10px 16px; border-radius:10px; border:2px solid var(--line); background:#fff; font-size:18px; }
  .toolbar .danger { border-color:var(--danger); color:var(--danger); font-weight:700; }
  .toolbar .spacer { flex:1; }
  .urlbox { margin-top:16px; background:var(--panel); border-radius:14px; padding:20px; text-align:center; }
  .urlbox .u { font-size:clamp(26px,3vw,52px); font-weight:800; word-break:break-all; }
  .urlbox #qr { display:inline-block; margin-top:14px; background:#fff; padding:12px; }

  .gate { text-align:center; padding:12vh 16px; }
  .gate p { font-size:24px; }
  .gate button { font-size:26px; font-weight:700; padding:16px 28px; border-radius:14px; border:0; background:var(--bar); color:#fff; }
  .msg { color:var(--danger); font-weight:700; }

  .modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
  .modal .box { background:#fff; border-radius:16px; padding:24px; max-width:520px; width:100%; font-size:20px; }
  .modal .box h3 { margin:0 0 10px; font-size:26px; color:var(--danger); }
  .modal .btns { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
  .modal .btns button { padding:12px 18px; border-radius:10px; border:2px solid var(--line); background:#fff; font-size:20px; }
  .modal .btns .danger { background:var(--danger); border-color:var(--danger); color:#fff; font-weight:700; }
</style>
</head>
<body>
<main>
  <div id="gate" class="gate">
    <p id="gateMsg">載入中…</p>
    <button id="login" hidden>用老師的 Google 帳號登入</button>
  </div>

  <div id="app" hidden>
    <h1>這些行為，會讓你覺得不舒服嗎？</h1>

    <div class="counts">
      <div class="count m"><div class="k">男生</div><div class="v" id="cm">0</div></div>
      <div class="count f"><div class="k">女生</div><div class="v" id="cf">0</div></div>
      <div class="count n"><div class="k">不想回答</div><div class="v" id="cn">0</div></div>
      <div class="count all"><div class="k">總計</div><div class="v" id="call">0</div></div>
    </div>

    <div class="tabs">
      <button class="tab" data-g="all">全體前五名</button>
      <button class="tab" data-g="m">男生前五名</button>
      <button class="tab" data-g="f">女生前五名</button>
    </div>

    <div class="chart" id="chart"></div>
    <p class="foot">百分比 ＝ 勾選這一項的人數 ÷ 這一組填答總人數（複選題，加起來會超過 100%）。「全體」包含選「不想回答」的同學。<span id="updated"></span></p>

    <div class="toolbar">
      <button id="refresh">🔄 重新整理</button>
      <button id="showUrl">🔗 顯示學生填寫網址</button>
      <span class="spacer"></span>
      <span id="who"></span>
      <button class="danger" id="clear">🗑 清除所有資料</button>
    </div>
    <div class="urlbox" id="urlbox" hidden>
      <div>學生請在瀏覽器輸入：</div>
      <div class="u" id="surl"></div>
      <div id="qr"></div>
    </div>
  </div>
</main>

<div class="modal" id="modal" hidden>
  <div class="box">
    <h3 id="mTitle"></h3>
    <div id="mBody"></div>
    <div class="btns">
      <button id="mNo">取消</button>
      <button class="danger" id="mYes"></button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import { GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, getDoc, setDoc, collection, getDocs, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { auth, db, SURVEY_ID, isTeacher, computeStats, topFive, esc } from "./survey.js";

const $ = (id) => document.getElementById(id);
const cfgRef = doc(db, "surveys", SURVEY_ID);
const respCol = collection(db, "surveys", SURVEY_ID, "responses");
const TITLES = { all: "全體前五名", m: "男生前五名", f: "女生前五名" };
let current = "all", stats = computeStats([]), unsub = null;

// ---- 登入 ----
$("login").onclick = () => {
  const p = new GoogleAuthProvider();
  p.setCustomParameters({ prompt: "select_account" });
  signInWithPopup(auth, p).catch((e) => { $("gateMsg").textContent = "登入失敗：" + e.message; });
};

onAuthStateChanged(auth, async (user) => {
  if (!user || user.isAnonymous) {
    $("gateMsg").textContent = "這是老師的結果頁，請先登入。";
    $("login").hidden = false;
    return;
  }
  if (!isTeacher(user)) {
    $("gateMsg").innerHTML = `<span class="msg">${esc(user.email)} 不是老師帳號，無法查看結果。</span>`;
    $("login").hidden = false;
    return;
  }
  $("gate").hidden = true;
  $("app").hidden = false;
  $("who").textContent = user.email;
  // 第一次使用時建立設定（round = 第幾輪，清除資料後會 +1）
  try {
    const cfg = await getDoc(cfgRef);
    if (!cfg.exists()) await setDoc(cfgRef, { round: 1 });
  } catch (e) { console.warn(e); }
  listen();
});

// ---- 即時更新 ----
function listen() {
  if (unsub) unsub();
  unsub = onSnapshot(respCol, (snap) => {
    update(snap.docs.map((d) => d.data()));
  }, (e) => {
    console.error(e);
    $("updated").textContent = "　⚠ 讀取失敗：" + e.message;
  });
}
function update(rows) {
  stats = computeStats(rows);
  render();
  $("updated").textContent = "　最後更新 " + new Date().toLocaleTimeString("zh-TW", { hour12: false });
}
$("refresh").onclick = async () => {
  try {
    const snap = await getDocs(respCol);
    update(snap.docs.map((d) => d.data()));
    listen(); // 順便重新接上即時更新
  } catch (e) { alert("重新整理失敗：" + e.message); }
};

// ---- 畫圖 ----
function render() {
  const c = stats.counts;
  $("cm").textContent = c.m; $("cf").textContent = c.f; $("cn").textContent = c.n; $("call").textContent = c.all;
  document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("on", b.dataset.g === current));
  const list = stats.groups[current];
  const total = current === "all" ? c.all : c[current];
  let html = `<h2>${TITLES[current]} <small>（共 ${total} 人）</small></h2>`;
  const top = topFive(list);
  if (!total || !top.length) {
    html += `<div class="empty">尚無資料</div>`;
  } else {
    let rank = 0, prev = null;
    top.forEach((x, i) => {
      if (x.count !== prev) { rank = i + 1; prev = x.count; }
      const tied = top.filter((y) => y.count === x.count).length > 1;
      const inside = x.pct >= 45; // 長條夠長時字放在裡面
      html += `<div class="row">
        <div class="rank">${rank}</div>
        <div class="label">${esc(x.label)}${tied ? '<span class="tie">（並列）</span>' : ""}</div>
        <div class="track">
          <div class="fill" style="width:${x.pct}%"></div>
          <div class="pct ${inside ? "in" : "out"}" style="${inside ? "left:16px" : `left:calc(${x.pct}% + 12px)`}">${x.pct}%<small>(${x.count}/${x.total} 人)</small></div>
        </div>
      </div>`;
    });
  }
  $("chart").innerHTML = html;
}
document.querySelectorAll(".tab").forEach((b) => b.onclick = () => { current = b.dataset.g; render(); });
// 簡報筆或鍵盤：左右鍵、1/2/3 切換
const ORDER = ["all", "m", "f"];
document.addEventListener("keydown", (e) => {
  if (!$("modal").hidden || $("app").hidden) return;
  let i = ORDER.indexOf(current);
  if (["ArrowRight", "PageDown"].includes(e.key)) i = (i + 1) % 3;
  else if (["ArrowLeft", "PageUp"].includes(e.key)) i = (i + 2) % 3;
  else if (["1", "2", "3"].includes(e.key)) i = Number(e.key) - 1;
  else return;
  e.preventDefault();
  current = ORDER[i];
  render();
});

// ---- 學生網址 ----
const studentUrl = new URL("./", location.href).href;
$("surl").textContent = studentUrl;
let qrMade = false;
$("showUrl").onclick = () => {
  $("urlbox").hidden = !$("urlbox").hidden;
  if (!qrMade && window.QRCode) { new QRCode($("qr"), { text: studentUrl, width: 260, height: 260 }); qrMade = true; }
  if (!$("urlbox").hidden) $("urlbox").scrollIntoView({ behavior: "smooth" });
};

// ---- 清除資料（二次確認）----
function ask(title, body, yes) {
  return new Promise((resolve) => {
    $("mTitle").textContent = title; $("mBody").innerHTML = body; $("mYes").textContent = yes;
    $("modal").hidden = false;
    $("mYes").onclick = () => { $("modal").hidden = true; resolve(true); };
    $("mNo").onclick = () => { $("modal").hidden = true; resolve(false); };
  });
}
$("clear").onclick = async () => {
  const n = stats.counts.all;
  if (!await ask("清除所有資料？", `目前有 <b>${n}</b> 份答卷，清除後無法復原。`, "要清除")) return;
  if (!await ask("再確認一次", "真的要刪除全部答卷嗎？刪除後，所有裝置都可以重新填寫一次。", "確定刪除")) return;
  const btn = $("clear");
  btn.disabled = true; btn.textContent = "清除中…";
  try {
    const snap = await getDocs(respCol);
    for (let i = 0; i < snap.docs.length; i += 400) {
      const b = writeBatch(db);
      snap.docs.slice(i, i + 400).forEach((d) => b.delete(d.ref));
      await b.commit();
    }
    const cfg = await getDoc(cfgRef);
    const round = (cfg.exists() && Number.isInteger(cfg.data().round) ? cfg.data().round : 1) + 1;
    await setDoc(cfgRef, { round });
    alert(`已清除 ${snap.docs.length} 份答卷。`);
  } catch (e) {
    alert("清除失敗：" + e.message);
  } finally {
    btn.disabled = false; btn.textContent = "🗑 清除所有資料";
  }
};

render();
</script>
</body>
</html>
