<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>匿名小調查</title>
<style>
  :root { --ink:#1b1f2a; --sub:#5b6475; --line:#d5dae3; --accent:#1d4ed8; --accent-soft:#e6edff; --bg:#f4f6fa; --err:#b42318; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; font-size:20px; line-height:1.5; }
  main { max-width:900px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:30px; margin:0 0 6px; }
  .note { color:var(--sub); margin:0 0 20px; font-size:18px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:20px; }
  .q { font-size:23px; font-weight:700; margin:0 0 4px; }
  .hint { color:var(--sub); font-size:17px; margin:0 0 14px; }
  .opts { display:grid; gap:10px; }
  .opts.g3 { grid-template-columns:repeat(3,1fr); }
  .opts.g2 { grid-template-columns:repeat(2,1fr); }
  @media (max-width:640px) { .opts.g2 { grid-template-columns:1fr; } .opts.g3 { grid-template-columns:1fr; } }
  label.opt { display:flex; align-items:center; gap:12px; padding:14px 16px; border:2px solid var(--line); border-radius:12px; cursor:pointer; background:#fff; user-select:none; min-height:60px; }
  label.opt:hover { border-color:#9fb3e6; }
  label.opt input { width:26px; height:26px; flex:none; accent-color:var(--accent); margin:0; }
  label.opt:has(input:checked) { border-color:var(--accent); background:var(--accent-soft); }
  .err { color:var(--err); font-weight:700; margin:12px 0 0; display:none; }
  .err.show { display:block; }
  button.send { width:100%; font-size:26px; font-weight:700; padding:18px; border:0; border-radius:14px; background:var(--accent); color:#fff; cursor:pointer; }
  button.send:disabled { background:#8fa6dd; cursor:wait; }
  .center { text-align:center; padding:60px 16px; }
  .center .big { font-size:40px; font-weight:800; margin:0 0 12px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <div id="loading" class="center"><p class="big" style="font-size:26px">載入中…</p></div>

  <div id="fail" class="center" hidden>
    <p class="big" style="font-size:28px">連線失敗</p>
    <p id="failMsg">請檢查網路後，按重新整理再試一次。</p>
  </div>

  <div id="thanks" class="center" hidden>
    <p class="big">謝謝你的填寫 🙏</p>
    <p id="thanksMsg" class="note">你的回答已經送出，可以關掉這個頁面了。</p>
  </div>

  <form id="form" hidden novalidate>
    <h1>匿名小調查</h1>
    <p class="note">這份調查完全匿名，不會知道是誰填的。請依照你真實的感受回答。</p>

    <section class="card">
      <p class="q">1. 你的性別</p>
      <p class="hint">（單選）</p>
      <div class="opts g3" id="genders"></div>
      <p class="err" id="errG">請選擇一個選項</p>
    </section>

    <section class="card">
      <p class="q">2. 以下哪些行為，如果發生在你身上，你會覺得不舒服？</p>
      <p class="hint">（可以選很多個，至少選一個）</p>
      <div class="opts g2" id="items"></div>
      <p class="err" id="errI">請至少勾選一個選項</p>
    </section>

    <button class="send" id="send" type="submit">送出</button>
    <p class="err" id="errSend"></p>
  </form>
</main>

<script type="module">
import { signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { auth, db, SURVEY_ID, GENDERS, ITEMS, esc } from "./survey.js";

const $ = (id) => document.getElementById(id);
const DONE_KEY = "survey_done_" + SURVEY_ID;
let round = 1, uid = null;

function show(id) {
  for (const x of ["loading", "fail", "thanks", "form"]) $(x).hidden = x !== id;
}
function getLocal() { try { return localStorage.getItem(DONE_KEY); } catch { return null; } }
function setLocal(v) { try { localStorage.setItem(DONE_KEY, v); } catch {} }

$("genders").innerHTML = GENDERS.map((g) =>
  `<label class="opt"><input type="radio" name="g" value="${g.key}"><span>${esc(g.label)}</span></label>`).join("");
$("items").innerHTML = ITEMS.map((t, i) =>
  `<label class="opt"><input type="checkbox" name="i" value="${i + 1}"><span>${esc(t)}</span></label>`).join("");

// 這台裝置這一輪是否已經交過（資料庫裡有自己的答卷）
async function alreadySent() {
  try {
    const snap = await getDoc(doc(db, "surveys", SURVEY_ID, "responses", uid));
    return snap.exists() && snap.data().round === round;
  } catch { return false; }
}

async function start(user) {
  uid = user.uid;
  try {
    const cfg = await getDoc(doc(db, "surveys", SURVEY_ID));
    if (cfg.exists() && Number.isInteger(cfg.data().round)) round = cfg.data().round;
  } catch (e) {
    console.warn(e);
  }
  if (getLocal() === String(round) || await alreadySent()) {
    $("thanksMsg").textContent = "這台裝置已經填寫過了，謝謝你！";
    show("thanks");
    return;
  }
  show("form");
}

let started = false;
onAuthStateChanged(auth, (user) => {
  if (user && !started) { started = true; start(user); }
});
signInAnonymously(auth).catch((e) => {
  console.error(e);
  show("fail");
});
setTimeout(() => { if (!started) show("fail"); }, 20000);

function withTimeout(p, ms) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
}

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const g = document.querySelector('input[name="g"]:checked')?.value;
  const items = [...document.querySelectorAll('input[name="i"]:checked')].map((x) => Number(x.value));
  $("errG").classList.toggle("show", !g);
  $("errI").classList.toggle("show", items.length === 0);
  $("errSend").classList.remove("show");
  if (!g || !items.length) {
    (!g ? $("errG") : $("errI")).scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  const btn = $("send");
  btn.disabled = true;
  btn.textContent = "送出中…";
  try {
    await withTimeout(setDoc(doc(db, "surveys", SURVEY_ID, "responses", uid), { g, items, round }), 15000);
    setLocal(String(round));
    show("thanks");
  } catch (e) {
    console.error(e);
    // 可能其實已經送出（例如按了兩次或網路慢），確認一下
    if (await alreadySent()) {
      setLocal(String(round));
      show("thanks");
      return;
    }
    $("errSend").textContent = "送出失敗，網路可能不穩，請再按一次「送出」。";
    $("errSend").classList.add("show");
    btn.disabled = false;
    btn.textContent = "送出";
  }
});
</script>
</body>
</html>
