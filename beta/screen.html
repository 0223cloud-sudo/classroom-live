<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>投影畫面</title>
  <script>
    // 自動更新：網站有新版本時，強制下載最新檔案（不必等瀏覽器暫存過期）
    (async () => {
      try {
        const r = await fetch("version.json", { cache: "no-store" });
        const v = String((await r.json()).v);
        window.APP_VERSION = v;
        const old = localStorage.getItem("appVersion");
        if (old === v) return;
        const files = ["index.html", "teacher.html", "screen.html", "css/style.css", "js/config.js", "js/firebase.js",
          "js/projection.js", "js/student.js", "js/teacher.js", "js/textsize.js"];
        await Promise.all(files.map((f) => fetch(f, { cache: "reload" }).catch(() => {})));
        localStorage.setItem("appVersion", v);
        // 確定有記住新版本才重新整理一次（無法儲存時不重整，避免一直重新整理）
        if (localStorage.getItem("appVersion") === v) location.reload();
      } catch (e) { /* 離線或讀不到就照常使用 */ }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body class="screen">
  <div class="screen-root" id="root">
    <div class="screen-body s-blank"><div class="big">載入中…</div></div>
  </div>
  <div id="login" class="modal hidden" style="background:rgba(0,0,0,.25)">
    <div class="card" style="font-size:18px">
      <h2>投影畫面</h2>
      <p class="muted">請用老師帳號登入，畫面會自動跟著目前的課堂。</p>
      <button class="btn big" id="btn-login">用 Google 帳號登入</button>
      <p class="status-bar bad hidden" id="err"></p>
    </div>
  </div>
  <script type="module">
    import { auth, db, doc, collection, query, where, onSnapshot, onAuthStateChanged,
      signInGoogle, signInSeat, isTeacher, signOut, $ } from "./js/firebase.js";
    import { renderScreen } from "./js/projection.js";

    // 網址可以帶 ?s=代碼；不帶的話自動跟著最新開始的課堂
    const fixed = (new URLSearchParams(location.search).get("s") || "").toUpperCase();
    let unsub = null;

    $("#btn-login").onclick = () => signInGoogle().catch((e) => {
      $("#err").textContent = "登入失敗：" + (e.code || e.message); $("#err").classList.remove("hidden");
    });

    onAuthStateChanged(auth, (u) => {
      if (unsub) { unsub(); unsub = null; }
      // 不用登入：教室電腦每次重開機都會清空，所以自動用匿名身分連線
      // （投影畫面只顯示要給全班看的內容，沒有姓名和對錯）
      if (!u) { signInSeat().catch(() => $("#login").classList.remove("hidden")); return; }
      $("#login").classList.add("hidden");
      const q = query(collection(db, "sessions"), where("active", "==", true));
      unsub = onSnapshot(q, (qs) => {
        const all = qs.docs.map((d) => d.data());
        const s = fixed ? all.find((x) => x.code === fixed)
          : all.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0))[0];
        renderScreen($("#root"), s || null);
      });
    });
  </script>
</body>
</html>
